# Replays the steps documented in README.md on a clean runner, using damast from PyPI.
#
# 'smoke' runs on every push/PR and only uses data that is in the repository.
# 'replicate' does the full README - it downloads ~1 GB of AIS data (cut to MAX_CSV_ROWS per source) -
# and therefore only runs on demand and once a week.
name: replication

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KERAS_BACKEND: torch
  # CPU-only torch wheels: avoids downloading the CUDA stack on a GPU-less runner
  UV_TORCH_BACKEND: cpu
  AISDK_URL: http://aisdata.ais.dk/aisdk-2026-06-01.zip
  MARINE_CADASTRE_URL: https://noaaocm.blob.core.windows.net/ais/csv2/csv2026/ais-2026-06-01.csv.zst
  # Runners are resource limited. So setting an upper limit for AIS messages kept from each downloaded CSV before conversion
  MAX_CSV_ROWS: 100000

jobs:
  # Installation and plugin registration, against the one input file that is in the repository.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          # pyproject requires >=3.12
          python-version: "3.12"

      - name: Install
        run: |
          uv venv venv-damast
          # GITHUB_ENV only applies to later steps - export for this one too
          export VIRTUAL_ENV="$PWD/venv-damast"
          echo "$PWD/venv-damast/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/venv-damast" >> "$GITHUB_ENV"
          uv pip install .
          uv pip list | grep -E '^damast'

      - name: Check plugin registration
        run: |
          damast plugins | tee plugins.txt
          # the transformers the two pregenerated pipelines instantiate, plus ParseTimestamp
          # from the README. Match the bare name - the listing layout has changed before.
          for t in AlignAISSchema ConcatDataFrames Healpix ExtractGroupStatistics ParseTimestamp; do
            grep -q "$t" plugins.txt || { echo "::error::plugin $t not registered"; exit 1; }
          done

      - name: Inspect input data
        run: damast inspect -f data/AIS_2026_06_01.parquet

      - name: Export the pipeline
        run: |
          python src/damast_sigspatial2026/1-prepare.py --output-dir . --pipeline-name prepare export
          test -f prepare.damast.ppl
          # the export is only useful if it loads back
          damast process --pipeline prepare.damast.ppl --describe

      - name: Upload pipeline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exported-pipeline
          path: prepare.damast.ppl
          if-no-files-found: warn

  # The full README: download, convert, join, prepare, train.
  replicate:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      # damast's BaseModel.build() plots every model via keras.utils.plot_model, which needs 'dot'
      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install
        run: |
          uv venv venv-damast
          # GITHUB_ENV only applies to later steps - export for this one too
          export VIRTUAL_ENV="$PWD/venv-damast"
          echo "$PWD/venv-damast/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/venv-damast" >> "$GITHUB_ENV"
          uv pip install .
          uv pip list | grep -E '^damast'

      # keeps the ~1 GB download out of every rerun
      - name: Cache converted input data
        id: ais-cache
        uses: actions/cache@v6
        with:
          path: |
            data/aisdk-2026-06-01.parquet
            data/ais-2026-06-01.parquet
          key: ais-inputs-2026-06-01-rows${{ env.MAX_CSV_ROWS }}-v2

      - name: Download and convert input data
        if: steps.ais-cache.outputs.cache-hit != 'true'
        run: |
          # keep the header plus MAX_CSV_ROWS rows; '|| true' because head closing the pipe
          # early makes the decompressor exit with SIGPIPE, which pipefail would turn into a failure
          wget -q -O aisdk-2026-06-01.zip "$AISDK_URL"
          { unzip -p aisdk-2026-06-01.zip || true; } | head -n $((MAX_CSV_ROWS + 1)) > aisdk-2026-06-01.csv
          rm aisdk-2026-06-01.zip
          test "$(wc -l < aisdk-2026-06-01.csv)" -gt 1
          damast convert -f aisdk-2026-06-01.csv --save-as data/aisdk-2026-06-01.parquet
          rm aisdk-2026-06-01.csv

          wget -q -O ais-2026-06-01.csv.zst "$MARINE_CADASTRE_URL"
          { zstd -dc ais-2026-06-01.csv.zst || true; } | head -n $((MAX_CSV_ROWS + 1)) > ais-2026-06-01.csv
          rm ais-2026-06-01.csv.zst
          test "$(wc -l < ais-2026-06-01.csv)" -gt 1
          damast convert -f ais-2026-06-01.csv --save-as data/ais-2026-06-01.parquet
          rm ais-2026-06-01.csv

          df -h .

      - name: Join the data sources
        run: |
          # the pipeline carries 'base_dir: results/joined'
          mkdir -p results/joined
          damast process --pipeline examples/join_sources.damast.ppl \
            --input-data df=data/aisdk-2026-06-01.parquet \
            --input-data marine-cadastre=data/ais-2026-06-01.parquet \
            --input-data barentswatch=data/AIS_2026_06_01.parquet \
            --output-file results/AIS_2026_06_01-joined.parquet --base-dir results
          test -f results/AIS_2026_06_01-joined.parquet

      - name: Rerun the pregenerated pipeline
        run: |
          damast process --pipeline examples/prepare.damast.ppl \
            --input-data ./results/AIS_2026_*-joined.parquet \
            --output-file ./results/AIS_2026.prepare.parquet --base-dir ./results
          damast inspect -f ./results/AIS_2026.prepare.parquet

      - name: Create and run the pipeline
        run: |
          python src/damast_sigspatial2026/1-prepare.py --output-dir . --pipeline-name prepare export
          test -f prepare.damast.ppl
          damast process --pipeline prepare.damast.ppl \
            --input-data ./results/AIS_2026_06_01-joined.parquet \
            --output-file results/AIS_2026_06_01.prepared.parquet
          test -f results/AIS_2026_06_01.prepared.parquet

      - name: Model training
        run: |
          python src/damast_sigspatial2026/2-ml-model-creation.py \
            --input-data ./results/AIS_2026_06_01.prepared.parquet \
            --pipeline ./examples/prepare.damast.ppl
          test -d /tmp/test-output-ais_preparation

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: replication-results
          path: |
            prepare.damast.ppl
            results/*.spec.yaml
            /tmp/test-output-ais_preparation/**/*.yaml
          if-no-files-found: warn
